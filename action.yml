# CyberXYZ DepAlert — composite GitHub Action
#
# Publish this directory as its own public repo (e.g. github.com/CyberXYZSecurity/depalert-action)
# with a v1 tag, then list it on the Marketplace. Consumers add:
#
#   - uses: CyberXYZSecurity/depalert-action@v1
#     with:
#       api-key: ${{ secrets.XYZ_API_KEY }}
#
name: "CyberXYZ DepAlert"
description: "Fail the build on malicious or quarantined dependencies. Scans package-lock.json, requirements*.txt, Pipfile.lock, poetry.lock and go.sum against the CyberXYZ decision engine."
author: "CyberXYZ Security"
branding:
  icon: "shield"
  color: "orange"

inputs:
  api-key:
    description: "CyberXYZ API key (sk_xyz_...). Store it as a repository secret."
    required: true
  fail-on:
    description: "Narrowest verdict that fails the build: block | quarantine | alert"
    required: false
    default: "block"
  api-url:
    description: "API base URL"
    required: false
    default: "https://api.cyberxyz.io"
  manifests:
    description: "Space-separated manifest paths. Default: auto-detect in the working directory."
    required: false
    default: ""
  python-version:
    description: "Python used to run the CLI"
    required: false
    default: "3.11"
  working-directory:
    description: "Directory to scan when manifests are auto-detected"
    required: false
    default: "."

outputs:
  verdict:
    description: "Worst verdict seen: allow | alert | quarantine | block | error. Also exported as env XYZ_VERDICT for later steps."
    value: ${{ steps.scan.outputs.verdict }}
  exit-code:
    description: "0 clean, 1 block, 2 quarantine, 3 alert, 4 backend unreachable"
    value: ${{ steps.scan.outputs.exit }}

runs:
  using: "composite"
  steps:
    # No pip cache: setup-python's cache needs a requirements/pyproject file in
    # the consumer's repo and hard-fails without one (npm-only or Go-only repos).
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - shell: bash
      run: pip install --quiet cyberxyz-scanner

    - id: scan
      shell: bash
      env:
        XYZ_API_KEY: ${{ inputs.api-key }}
        XYZ_API_URL: ${{ inputs.api-url }}
        FAIL_ON: ${{ inputs.fail-on }}
        MANIFESTS: ${{ inputs.manifests }}
        WORKDIR: ${{ inputs.working-directory }}
      # This step never fails: it records the worst verdict so the output is
      # always populated. The gate step below is the one that turns the job red.
      run: |
        # GitHub runs composite bash steps with -e; the scanner exits non-zero
        # on purpose, so errexit must be off here or the step dies mid-loop.
        set +e
        set -u
        worst=0
        run_scan () {  # $1 flag, $2 path
          echo "::group::xyz depalert scan $2"
          if xyz depalert scan "$1" "$2" --fail-on "$FAIL_ON"; then rc=0; else rc=$?; fi
          echo "::endgroup::"
          if [ "$rc" -gt "$worst" ]; then worst=$rc; fi
          return 0
        }
        cd "$WORKDIR" || { echo "::error::working-directory '$WORKDIR' not found"; echo "verdict=error" >> "$GITHUB_OUTPUT"; echo "exit=4" >> "$GITHUB_OUTPUT"; exit 0; }
        if [ -n "$MANIFESTS" ]; then
          for f in $MANIFESTS; do
            case "$f" in
              *package-lock.json) run_scan --package-lock "$f" ;;
              *go.sum)            run_scan --go-sum "$f" ;;
              *)                  run_scan --requirements "$f" ;;
            esac
          done
        else
          found=0
          if [ -f package-lock.json ]; then run_scan --package-lock package-lock.json; found=1; fi
          for f in requirements.txt requirements-dev.txt requirements-prod.txt Pipfile.lock poetry.lock; do
            if [ -f "$f" ]; then run_scan --requirements "$f"; found=1; fi
          done
          if [ -f go.sum ]; then run_scan --go-sum go.sum; found=1; fi
          if [ "$found" = 0 ]; then echo "::notice title=CyberXYZ DepAlert::no dependency manifests found in $WORKDIR, nothing scanned"; fi
        fi
        case "$worst" in
          0) v=allow ;; 1) v=block ;; 2) v=quarantine ;; 3) v=alert ;; *) v=error ;;
        esac
        echo "verdict=$v" >> "$GITHUB_OUTPUT"
        echo "exit=$worst" >> "$GITHUB_OUTPUT"
        echo "XYZ_VERDICT=$v" >> "$GITHUB_ENV"
        echo "### CyberXYZ DepAlert: **$v**" >> "$GITHUB_STEP_SUMMARY"

    - name: gate
      if: steps.scan.outputs.exit != '0'
      shell: bash
      run: |
        echo "::error title=CyberXYZ DepAlert::verdict ${{ steps.scan.outputs.verdict }} (exit ${{ steps.scan.outputs.exit }}), see the scan output above"
        exit ${{ steps.scan.outputs.exit }}
