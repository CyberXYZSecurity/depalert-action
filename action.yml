# CyberXYZ DepAlert — composite GitHub Action
#
# Publish this directory as its own public repo (e.g. github.com/CyberXYZSecurity/depalert-action)
# with a v1 tag, then list it on the Marketplace. Consumers add:
#
#   - uses: CyberXYZSecurity/depalert-action@v1
#     with:
#       api-key: ${{ secrets.XYZ_API_KEY }}
#
# mode: scan (default) checks the lockfiles and gates the build.
# mode: protect routes the job's own npm / pip / uv / yarn / go / NuGet
# installs through the CyberXYZ proxy; put it before your install steps and
# keep a scan step after them.
#
name: "CyberXYZ DepAlert"
description: "Route CI installs through the CyberXYZ proxy and fail the build on malicious or quarantined dependencies."
author: "CyberXYZ Security"
branding:
  icon: "shield"
  color: "orange"

inputs:
  api-key:
    description: "CyberXYZ API key (sk_xyz_...). Store it as a repository secret."
    required: true
  mode:
    description: "scan: check the manifests and gate the build (default). protect: route every later install step in this job through the CyberXYZ proxy; run it before installs."
    required: false
    default: "scan"
  network-lock:
    description: "protect mode: also blackhole the public registries (registry.npmjs.org, pypi.org, proxy.golang.org, api.nuget.org, ...) in /etc/hosts so nothing can bypass the proxy. Linux/macOS runners with sudo only."
    required: false
    default: "false"
  strict:
    description: "protect mode: fail the step when the proxy could not be configured. Default false: the job continues unprotected with a warning."
    required: false
    default: "false"
  cli-version:
    description: "cyberxyz-scanner version to install. 'latest' installs the newest release."
    required: false
    default: "1.4.59"
  fail-on:
    description: "Narrowest verdict that fails the build: block | quarantine | alert"
    required: false
    default: "block"
  api-url:
    description: "API base URL"
    required: false
    default: "https://api.cyberxyz.io"
  manifests:
    description: "Space-separated manifest paths. Default: auto-detect in the working directory."
    required: false
    default: ""
  python-version:
    description: "Python used to run the CLI"
    required: false
    default: "3.11"
  working-directory:
    description: "Directory to scan when manifests are auto-detected"
    required: false
    default: "."

outputs:
  verdict:
    description: "scan mode: worst verdict seen: allow | alert | quarantine | block | error. Also exported as env XYZ_VERDICT for later steps. Empty in protect mode."
    value: ${{ steps.scan.outputs.verdict }}
  exit-code:
    description: "0 clean, 1 block, 2 quarantine, 3 alert, 4 backend unreachable"
    value: ${{ steps.scan.outputs.exit }}

runs:
  using: "composite"
  steps:
    # No pip cache: setup-python's cache needs a requirements/pyproject file in
    # the consumer's repo and hard-fails without one (npm-only or Go-only repos).
    - name: check mode
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: |
        case "$MODE" in
          scan|protect) ;;
          *) echo "::error title=CyberXYZ DepAlert::mode must be scan or protect, got '$MODE'"; exit 1 ;;
        esac

    # ── mode: protect ────────────────────────────────────────────────────
    # No setup-python here: it would put a different Python first on PATH for
    # every later step of the consumer's job. The CLI goes into its own venv
    # built from whatever python the runner already has.
    - id: protect
      if: inputs.mode == 'protect'
      shell: bash
      env:
        XYZ_API_KEY: ${{ inputs.api-key }}
        XYZ_API_URL: ${{ inputs.api-url }}
        CLI_VERSION: ${{ inputs.cli-version }}
        NETWORK_LOCK: ${{ inputs.network-lock }}
        STRICT: ${{ inputs.strict }}
      run: |
        set +e
        warn () {
          echo "::warning title=CyberXYZ protect::$1; installs in this job are NOT routed through CyberXYZ"
          if [ "$STRICT" = "true" ]; then exit 1; fi
          exit 0
        }
        PY="$(command -v python3 || command -v python)"
        [ -n "$PY" ] || warn "no python on the runner to run the CLI"
        venv="${RUNNER_TEMP:-/tmp}/cyberxyz-cli"
        "$PY" -m venv "$venv" >/dev/null || warn "could not create a venv for the CLI"
        bin="$venv/bin"; [ -d "$bin" ] || bin="$venv/Scripts"
        spec="cyberxyz-scanner"; [ "$CLI_VERSION" = "latest" ] || spec="cyberxyz-scanner==$CLI_VERSION"
        "$bin/python" -m pip install --quiet --disable-pip-version-check "$spec" || warn "could not install $spec"
        args="--format github"
        [ "$NETWORK_LOCK" = "true" ] && args="$args --network-lock"
        [ "$STRICT" = "true" ] && args="$args --strict"
        # xyz ci protect exits 0 on its own failures unless --strict; a
        # non-zero exit here means the CLI is too old to have the command.
        "$bin/xyz" ci protect $args || { rc=$?; [ "$STRICT" = "true" ] && exit $rc; warn "xyz ci protect failed (exit $rc)"; }

    # ── mode: scan ───────────────────────────────────────────────────────
    - if: inputs.mode == 'scan'
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - if: inputs.mode == 'scan'
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        spec="cyberxyz-scanner"; [ "$CLI_VERSION" = "latest" ] || spec="cyberxyz-scanner==$CLI_VERSION"
        pip install --quiet "$spec"

    - id: scan
      if: inputs.mode == 'scan'
      shell: bash
      env:
        XYZ_API_KEY: ${{ inputs.api-key }}
        XYZ_API_URL: ${{ inputs.api-url }}
        FAIL_ON: ${{ inputs.fail-on }}
        MANIFESTS: ${{ inputs.manifests }}
        WORKDIR: ${{ inputs.working-directory }}
      # This step never fails: it records the worst verdict so the output is
      # always populated. The gate step below is the one that turns the job red.
      run: |
        # GitHub runs composite bash steps with -e; the scanner exits non-zero
        # on purpose, so errexit must be off here or the step dies mid-loop.
        set +e
        set -u
        worst=0
        # Exit codes are not ordered by severity (1 block, 2 quarantine,
        # 3 alert, 4+ error), so compare ranks, not raw codes.
        rank () { case "$1" in 0) echo 0 ;; 3) echo 1 ;; 1) echo 4 ;; 2) echo 3 ;; *) echo 2 ;; esac; }
        run_scan () {  # $1 flag, $2 path
          echo "::group::xyz depalert scan $2"
          if xyz depalert scan "$1" "$2" --fail-on "$FAIL_ON"; then rc=0; else rc=$?; fi
          echo "::endgroup::"
          if [ "$(rank "$rc")" -gt "$(rank "$worst")" ]; then worst=$rc; fi
          return 0
        }
        cd "$WORKDIR" || { echo "::error::working-directory '$WORKDIR' not found"; echo "verdict=error" >> "$GITHUB_OUTPUT"; echo "exit=4" >> "$GITHUB_OUTPUT"; exit 0; }
        if [ -n "$MANIFESTS" ]; then
          for f in $MANIFESTS; do
            case "$f" in
              *package-lock.json) run_scan --package-lock "$f" ;;
              *go.sum)            run_scan --go-sum "$f" ;;
              *requirements*.txt|*Pipfile.lock|*poetry.lock|*uv.lock)
                                  run_scan --requirements "$f" ;;
              # Not parsed yet: warn instead of failing the job (the scanner
              # now refuses a non-empty manifest it cannot read).
              *)                  echo "::warning title=CyberXYZ DepAlert::$f is not a supported manifest yet, skipped" ;;
            esac
          done
        else
          found=0
          if [ -f package-lock.json ]; then run_scan --package-lock package-lock.json; found=1; fi
          for f in requirements.txt requirements-dev.txt requirements-prod.txt Pipfile.lock poetry.lock; do
            if [ -f "$f" ]; then run_scan --requirements "$f"; found=1; fi
          done
          if [ -f go.sum ]; then run_scan --go-sum go.sum; found=1; fi
          if [ "$found" = 0 ]; then echo "::notice title=CyberXYZ DepAlert::no dependency manifests found in $WORKDIR, nothing scanned"; fi
        fi
        case "$worst" in
          0) v=allow ;; 1) v=block ;; 2) v=quarantine ;; 3) v=alert ;; *) v=error ;;
        esac
        echo "verdict=$v" >> "$GITHUB_OUTPUT"
        echo "exit=$worst" >> "$GITHUB_OUTPUT"
        echo "XYZ_VERDICT=$v" >> "$GITHUB_ENV"
        echo "### CyberXYZ DepAlert: **$v**" >> "$GITHUB_STEP_SUMMARY"

    - name: gate
      # mode guard: when scan is skipped its outputs are empty, and '' != '0'.
      if: inputs.mode == 'scan' && steps.scan.outputs.exit != '0'
      shell: bash
      run: |
        echo "::error title=CyberXYZ DepAlert::verdict ${{ steps.scan.outputs.verdict }} (exit ${{ steps.scan.outputs.exit }}), see the scan output above"
        exit ${{ steps.scan.outputs.exit }}
