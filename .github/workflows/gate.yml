name: CyberXYZ gate

on:
  pull_request:
    paths: ["examples/**"]

jobs:
  depalert:
    name: dependency gate (examples/webapp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: CyberXYZSecurity/depalert-action@v1
        with:
          api-key: ${{ secrets.XYZ_API_KEY }}
          working-directory: examples/webapp
